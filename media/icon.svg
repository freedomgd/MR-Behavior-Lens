<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- lifelines (faint, inside the lens) -->
  <line x1="70" y1="62" x2="70" y2="170" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>
  <line x1="158" y1="62" x2="158" y2="170" stroke="#ffffff" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round"/>

  <!-- red: flow that disappeared (dashed) -->
  <line x1="78" y1="92" x2="132" y2="92" stroke="#fb7185" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 20"/>
  <polygon points="152,92 128,79 128,105" fill="#fb7185"/>

  <!-- green: new flow (solid) -->
  <line x1="78" y1="138" x2="130" y2="138" stroke="#34d399" stroke-width="11" stroke-linecap="round"/>
  <polygon points="152,138 128,125 128,151" fill="#34d399"/>

  <!-- magnifier -->
  <circle cx="114" cy="114" r="72" fill="none" stroke="#ffffff" stroke-width="14"/>
  <line x1="166" y1="166" x2="216" y2="216" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
</svg>
