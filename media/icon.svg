<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- lifelines (inside the lens) -->
  <line x1="72" y1="58" x2="72" y2="168" stroke="#a5b4fc" stroke-width="9" stroke-linecap="round"/>
  <line x1="152" y1="58" x2="152" y2="168" stroke="#a5b4fc" stroke-width="9" stroke-linecap="round"/>

  <!-- red: flow that disappeared (dashed) -->
  <line x1="82" y1="90" x2="124" y2="90" stroke="#f43f5e" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 21"/>
  <polygon points="146,90 121,76 121,104" fill="#f43f5e"/>

  <!-- green: new flow (solid) -->
  <line x1="82" y1="136" x2="122" y2="136" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
  <polygon points="146,136 121,122 121,150" fill="#10b981"/>

  <!-- magnifier -->
  <circle cx="112" cy="112" r="86" fill="none" stroke="url(#lens)" stroke-width="24"/>
  <line x1="176" y1="176" x2="234" y2="234" stroke="#7c3aed" stroke-width="34" stroke-linecap="round"/>
</svg>
